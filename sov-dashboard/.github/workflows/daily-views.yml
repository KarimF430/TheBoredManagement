name: SOV Panel Cron

# Two schedules drive the whole system:
#   * daily   08:00 UTC — refresh view counts for every tracked video
#   * weekly  Mon 02:00 UTC — re-run the full keyword fetch for every project,
#     which is what makes week-over-week ranking movement measurable
#
# Both jobs are chunked: each HTTP call processes a slice and returns
# next_offset / remaining / completed, and the loop repeats until it is done.
on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job type'
        required: true
        default: 'daily_views'
        type: choice
        options:
          - daily_views
          - weekly_refresh
          - refresh_views
      campaign_id:
        description: 'Campaign ID (optional, leave empty for all projects)'
        required: false
        type: string
      chunk_size:
        description: 'Daily views: videos per chunk (default 500)'
        required: false
        default: '500'
        type: string
      keyword_chunk:
        description: 'Weekly refresh: keywords per chunk (default 5)'
        required: false
        default: '5'
        type: string

env:
  SITE_URL: ${{ secrets.SITE_URL || 'https://sov-panel-101.vercel.app' }}

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Resolve job type
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then
            JOB="${{ github.event.inputs.job }}"
          elif [ "${{ github.event.schedule }}" = "0 2 * * 1" ]; then
            JOB="weekly_refresh"
          else
            JOB="daily_views"
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Resolved job: $JOB"

      - name: Daily views (chunked, resumable)
        if: ${{ steps.resolve.outputs.job == 'daily_views' }}
        run: |
          set -uo pipefail
          CHUNK_SIZE="${{ github.event.inputs.chunk_size || '500' }}"
          CAMPAIGN="${{ github.event.inputs.campaign_id }}"
          AUTH_PARAM=""
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            AUTH_PARAM="&secret=${{ secrets.CRON_SECRET }}"
          fi
          CAMPAIGN_PARAM=""
          if [ -n "$CAMPAIGN" ]; then
            CAMPAIGN_PARAM="&campaign_id=$CAMPAIGN"
          fi

          echo "=== Daily views (chunk=$CHUNK_SIZE) ==="
          OFFSET=0
          CHUNK_NUM=0
          FAILURES=0

          while true; do
            CHUNK_NUM=$((CHUNK_NUM + 1))
            echo "--- chunk $CHUNK_NUM (offset=$OFFSET) ---"

            RESPONSE=$(curl -sS -m 120 -w "\n%{http_code}" \
              "$SITE_URL/api/cron?job=daily_views&offset=$OFFSET&limit=$CHUNK_SIZE$CAMPAIGN_PARAM$AUTH_PARAM") || RESPONSE=$'\n000'

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" != "200" ]; then
              FAILURES=$((FAILURES + 1))
              echo "HTTP $HTTP_CODE at offset $OFFSET (failure $FAILURES)"
              echo "$BODY"
              if [ "$FAILURES" -ge 3 ]; then
                echo "Too many consecutive failures — aborting."
                exit 1
              fi
              sleep 10
              continue
            fi

            FAILURES=0
            NEXT=$(echo "$BODY" | jq -r '.next_offset // 0')
            REMAINING=$(echo "$BODY" | jq -r '.remaining // 0')
            COMPLETED=$(echo "$BODY" | jq -r '.completed // false')
            echo "  updated=$(echo "$BODY" | jq -r '.updated // 0') remaining=$REMAINING unique=$(echo "$BODY" | jq -r '.total_unique // 0') entries=$(echo "$BODY" | jq -r '.total_entries // 0')"

            if [ "$COMPLETED" = "true" ] || [ "$REMAINING" = "0" ]; then
              echo "=== Daily views complete ==="
              break
            fi

            if [ "$NEXT" -le "$OFFSET" ]; then
              echo "No forward progress (offset stuck at $OFFSET) — aborting."
              exit 1
            fi
            OFFSET=$NEXT
            sleep 1
          done

      - name: Weekly keyword refresh (chunked, resumable)
        if: ${{ steps.resolve.outputs.job == 'weekly_refresh' }}
        run: |
          set -uo pipefail
          KEYWORD_CHUNK="${{ github.event.inputs.keyword_chunk || '5' }}"
          CAMPAIGN="${{ github.event.inputs.campaign_id }}"
          AUTH_PARAM=""
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            AUTH_PARAM="&secret=${{ secrets.CRON_SECRET }}"
          fi
          CAMPAIGN_PARAM=""
          if [ -n "$CAMPAIGN" ]; then
            CAMPAIGN_PARAM="&campaign_id=$CAMPAIGN"
          fi

          echo "=== Weekly refresh (chunk=$KEYWORD_CHUNK keywords) ==="
          OFFSET=0
          CHUNK_NUM=0
          FAILURES=0
          TOTAL_QUOTA=0

          while true; do
            CHUNK_NUM=$((CHUNK_NUM + 1))
            echo "--- chunk $CHUNK_NUM (offset=$OFFSET) ---"

            RESPONSE=$(curl -sS -m 120 -w "\n%{http_code}" \
              "$SITE_URL/api/cron?job=weekly_refresh&offset=$OFFSET&limit=$KEYWORD_CHUNK$CAMPAIGN_PARAM$AUTH_PARAM") || RESPONSE=$'\n000'

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" != "200" ]; then
              FAILURES=$((FAILURES + 1))
              echo "HTTP $HTTP_CODE at offset $OFFSET (failure $FAILURES)"
              echo "$BODY"
              if [ "$FAILURES" -ge 3 ]; then
                echo "Too many consecutive failures — aborting."
                exit 1
              fi
              sleep 15
              continue
            fi

            FAILURES=0
            NEXT=$(echo "$BODY" | jq -r '.next_offset // 0')
            REMAINING=$(echo "$BODY" | jq -r '.remaining // 0')
            COMPLETED=$(echo "$BODY" | jq -r '.completed // false')
            QUOTA=$(echo "$BODY" | jq -r '.total_quota // 0')
            TOTAL_QUOTA=$((TOTAL_QUOTA + QUOTA))
            echo "  processed=$(echo "$BODY" | jq -r '.keywords_processed // 0') failed=$(echo "$BODY" | jq -r '.failed // 0') remaining=$REMAINING quota=$QUOTA"
            echo "$BODY" | jq -r '.errors[]? | "    ERROR \(.keyword): \(.error)"'

            if [ "$COMPLETED" = "true" ] || [ "$REMAINING" = "0" ]; then
              echo "=== Weekly refresh complete (total quota: $TOTAL_QUOTA) ==="
              break
            fi

            if [ "$NEXT" -le "$OFFSET" ]; then
              echo "No forward progress (offset stuck at $OFFSET) — aborting."
              exit 1
            fi
            OFFSET=$NEXT
            sleep 2
          done

      - name: Refresh materialized views
        if: ${{ steps.resolve.outputs.job == 'refresh_views' }}
        run: |
          AUTH_PARAM=""
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            AUTH_PARAM="&secret=${{ secrets.CRON_SECRET }}"
          fi

          RESPONSE=$(curl -sS -m 120 -w "\n%{http_code}" \
            "$SITE_URL/api/cron?job=refresh_views$AUTH_PARAM")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "HTTP: $HTTP_CODE"
          echo "$RESPONSE" | sed '$d'
          [ "$HTTP_CODE" = "200" ]
